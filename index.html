<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
th,tr,td {border: 1px solid;}
</style>
<body>
    <table style="border: 1px solid black; border-radius: 10%; border-collapse: separate;">
        <h3>Bài tập thực hành Bảng</h3>
        <tr>
            <th rowspan="2" style="border: 1px solid greenyellow;">Nhóm học phần</th>
            <th rowspan="2" style="border: 1px solid blue;">Môn học</th>
            <th colspan="2" style="border: 1px solid red;">Số tiết</th>
        </tr>
        <tr>
            <td style="border: 1px solid purple;">Lý thuyết</td>
            <td style="border: 1px solid black;">Thực hành</td>
        </tr>
        <tr> 
            <td rowspan="4" style="border: 1px black;">1.Tin học văn phòng</td>
            <td>Hệ điều hành Windows</td>
            <td>200</td>
            <td>500</td>
        </tr>
        <tr>
            <td>Sử dụng Internet</td>
            <td>345</td>
            <td>4444</td>
        </tr>
        <tr>
            <td>Soạn thảo văn bản</td>
            <td>666</td>
            <td>2222</td>
        </tr>
        <tr>
            <td>A di đà phật</td>
            <td>2</td>
            <td>6</td>
        </tr>
        <tr>
            <td rowspan="3">2.Mùa</td>
            <td>Mùa đông</td>
            <td>56</td>
            <td>67</td>
        </tr>
        <tr>
            <td>Mùa hè</td>
            <td>12</td>
            <td>53</td>
        </tr>
        <tr>
            <td>ABC</td>
            <td>1</td>
            <td>99</td>
        </tr>
    </table>
</body>
</html>
